    const f = floaters[k];
    f.life -= dt;
    f.p.y += dt * 1.1;
    _proj.copy(f.p).project(camera);
    if (f.life <= 0 || _proj.z > 1) { f.el.remove(); floaters.splice(k, 1); continue; }
    const x = (_proj.x * 0.5 + 0.5) * innerWidth, y = (-_proj.y * 0.5 + 0.5) * innerHeight;
    f.el.style.transform = `translate(-50%, -50%) translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;

  }
}

/* =====================================================================
   12. 星之碎片：散落在山頂、半空與湖面上的收集品
   ===================================================================== */
function makeStarGeometry(R = 0.42, r = 0.19) {
  const shape = new THREE.Shape();
  for (let k = 0; k < 10; k++) {
    const a = (k / 10) * Math.PI * 2 + Math.PI / 2, rad = k % 2 ? r : R;
    if (k === 0) shape.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
    else shape.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, { depth: 0.12, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.06, bevelSegments: 3 });
  g.center();
  return g;
}
class StarFragments {
  constructor(scene) {
    this.group = new THREE.Group();
    scene.add(this.group);
    this.geo = makeStarGeometry();
    this.mat = new THREE.MeshToonMaterial({ color: '#ffd84a', emissive: '#ffae2e', emissiveIntensity: 0.6, gradientMap: gradients.base });
    this.glowMat = new THREE.SpriteMaterial({ map: glowTex, color: '#ffe08a', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, opacity: 0.7 });
    this.items = [];
  }
  get total() { return this.items.length; }
  get found() { return this.items.filter((s) => s.collected).length; }
  generate(terrain, rand, spawn, colliders, collected = []) {
    this.group.clear();
    this.items = [];
    const far = (x, z) => Math.hypot(x - spawn.x, z - spawn.z) > 18 &&
      this.items.every((s) => Math.hypot(s.x - x, s.z - z) > 22) &&
      colliders.every((c) => Math.hypot(c.x - x, c.z - z) > c.r + 1.2);
    // 山頂 ×5（選最高點）、半空 ×4（要跳或滑翔）、湖面 ×3（游過去或從岸邊滑翔）
    const plan = ['hill', 'hill', 'hill', 'hill', 'hill', 'air', 'air', 'air', 'air', 'lake', 'lake', 'lake'];
    for (const type of plan) {
      let best = null;
      for (let k = 0; k < 90; k++) {
        // 在可活動的圓盤內取樣，確保每一顆都拿得到
        const ang = rand() * Math.PI * 2, rad = Math.sqrt(rand()) * WORLD.PLAY * 0.88;
        const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
        if (!far(x, z)) continue;
        const h = terrain.heightAt(x, z);
        if (type === 'lake') { if (h < -1.2) { best = { x, z, h }; break; } continue; }
        if (h < WORLD.WATER_Y + 0.5 || terrain.slopeAt(x, z) > 0.35) continue;
        if (type === 'air') { best = { x, z, h }; break; }
        if (!best || h > best.h) best = { x, z, h };
      }
      if (!best) continue;
      const off = type === 'hill' ? 1.1 : type === 'air' ? 2.7 + rand() * 0.5 : 0;
      const g = new THREE.Group();
      const mesh = new THREE.Mesh(this.geo, this.mat);
      mesh.castShadow = true;
      const glow = new THREE.Sprite(this.glowMat);
      glow.scale.setScalar(2.6);
      g.add(mesh, glow);
      this.group.add(g);
      const item = { type, x: best.x, z: best.z, off, base: 0, ph: rand() * 6, group: g, mesh, collected: false };
      item.base = type === 'lake' ? WORLD.WATER_Y + 1.7 : best.h + off;
      g.position.set(item.x, item.base, item.z);
      this.items.push(item);
    }
    for (const i of collected) if (this.items[i]) { this.items[i].collected = true; this.items[i].group.visible = false; }
  }
  refreshRegion(b, terrain) {
    for (const s of this.items) {
      if (s.type === 'lake' || s.x < b.x0 || s.x > b.x1 || s.z < b.z0 || s.z > b.z1) continue;
      s.base = Math.max(terrain.heightAt(s.x, s.z), WORLD.WATER_Y) + s.off;
    }
  }
  update(dt, t, p, onCollect) {
    for (let i = 0; i < this.items.length; i++) {
      const s = this.items[i];
      if (s.collected) continue;
      s.group.position.y = s.base + Math.sin(t * 2 + s.ph) * 0.18;
      s.mesh.rotation.y += dt * 1.6;
      s.mesh.rotation.z = Math.sin(t * 1.3 + s.ph) * 0.2;
      const d = Math.hypot(p.x - s.x, p.y + 0.6 - s.group.position.y, p.z - s.z);
      if (d < 1.35) {
        s.collected = true;
        s.group.visible = false;
        onCollect(s, i);
      }
    }
  }
  collectedList() { return this.items.map((s, i) => (s.collected ? i : -1)).filter((i) => i >= 0); }
}

const geoCache = new Map();
const cachedGeo = (key, fn) => { if (!geoCache.has(key)) geoCache.set(key, fn()); return geoCache.get(key); };
const matCache = new Map();
const toonMat = (hex) => {
  if (!matCache.has(hex)) matCache.set(hex, new THREE.MeshToonMaterial({ color: hex, gradientMap: gradients.base }));
  return matCache.get(hex);
};
function piece(parent, geo, mat, [x, y, z], opt = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (opt.rot) m.rotation.set(...opt.rot);
  if (opt.scale) m.scale.set(...opt.scale);
  m.castShadow = opt.shadow !== false;
  m.receiveShadow = true;
  parent.add(m);
  if (opt.outline !== false) addOutline(m, opt.ol ?? 0.03);
  return m;
}
function addGlow(parent, [x, y, z], size) {
  const s = new THREE.Sprite(glowSpriteMat);
  s.position.set(x, y, z);
  s.scale.setScalar(size);
  s.userData.isGlow = true;
  parent.add(s);
  return s;
}
const cyl = (rt, rb, h, seg = 10) => new THREE.CylinderGeometry(rt, rb, h, seg);
const WOOD = '#a87447', WOOD_DK = '#7a5233', STONE = '#bdb5ae', STONE_DK = '#9c948e';

function makeFence() {
  const g = new THREE.Group();
  const post = cachedGeo('fencePost', () => cyl(0.08, 0.1, 1.1, 8).translate(0, 0.55, 0));
  const cap = cachedGeo('fenceCap', () => new THREE.SphereGeometry(0.095, 10, 8));
  const rail = cachedGeo('fenceRail', () => new THREE.CapsuleGeometry(0.055, 2.2, 4, 8).rotateZ(Math.PI / 2));
  for (const x of [-1.1, 0, 1.1]) { piece(g, post, toonMat(WOOD_DK), [x, 0, 0]); piece(g, cap, toonMat(WOOD_DK), [x, 1.12, 0]); }
  for (const y of [0.45, 0.85]) piece(g, rail, toonMat(WOOD), [0, y, 0]);
  return g;
}
function makeBench() {
  const g = new THREE.Group();
  const log = cachedGeo('benchLog', () => new THREE.CapsuleGeometry(0.13, 1.3, 4, 10).rotateZ(Math.PI / 2));
  const back = cachedGeo('benchBack', () => new THREE.CapsuleGeometry(0.1, 1.3, 4, 10).rotateZ(Math.PI / 2));
  const stump = cachedGeo('benchStump', () => cyl(0.15, 0.17, 0.36, 10).translate(0, 0.18, 0));
  const post = cachedGeo('benchPost', () => cyl(0.06, 0.07, 0.75, 8).translate(0, 0.375, 0));
  for (const x of [-0.55, 0.55]) { piece(g, stump, toonMat(WOOD_DK), [x, 0, 0]); piece(g, post, toonMat(WOOD_DK), [x, 0.2, -0.3]); }
  for (const z of [-0.12, 0.14]) piece(g, log, toonMat(WOOD), [0, 0.47, z]);
  piece(g, back, toonMat(WOOD), [0, 0.88, -0.3]);
  return g;
}
function makePlanter() {
  const g = new THREE.Group();
  const box = cachedGeo('planterBox', () => cyl(0.9, 0.95, 0.36, 18).translate(0, 0.18, 0));
  const soil = cachedGeo('planterSoil', () => cyl(0.82, 0.82, 0.04, 18));
  piece(g, box, toonMat(WOOD), [0, 0, 0]);
  piece(g, soil, toonMat('#6b4a32'), [0, 0.36, 0], { outline: false });
  for (let k = 0; k < 7; k++) {   // 會隨風搖曳的小花

// 可建造物件與捏地形工具（radius：佔地；colliders：[x, z, r]；top：可越過的高度）
const BUILD_DEFS = [
  { id: 'fence',    name: '木柵欄', icon: '🪵', cost: { wood: 3 },              radius: 1.3, top: 1.1, colliders: [[-1.1, 0, 0.2], [0, 0, 0.2], [1.1, 0, 0.2]], make: makeFence },
  { id: 'bench',    name: '長椅',   icon: '🪑', cost: { wood: 4 },              radius: 1.0, top: 0.55, colliders: [[-0.5, 0, 0.35], [0.5, 0, 0.35]], make: makeBench },
  { id: 'planter',  name: '花圃',   icon: '🌷', cost: { wood: 2, flower: 4 },   radius: 1.0, top: 0.4, colliders: [[0, 0, 0.9]], make: makePlanter },
  { id: 'lantern',  name: '石燈籠', icon: '🏮', cost: { stone: 4 },             radius: 0.7, top: 1.9, colliders: [[0, 0, 0.45]], make: makeLantern },
  { id: 'hut',      name: '小木屋', icon: '🛖', cost: { wood: 10, stone: 6 },   radius: 2.6, top: 99, colliders: [[0, 0, 2.0]], make: makeHut },
  { id: 'starlamp', name: '星之燈', icon: '🌟', cost: { star: 1, stone: 2 },    radius: 0.7, top: 99, colliders: [[0, 0, 0.32]], make: makeStarLamp },
  { id: 'raise',    name: '抬升',   icon: '⛰️', tool: 'raise',   color: '#ffcf3d', label: '抬升地形' },
  { id: 'lower',    name: '下挖',   icon: '🕳️', tool: 'lower',   color: '#8fd0ff', label: '下挖地形（挖到水面以下會變成池塘）' },
  { id: 'flatten',  name: '整平',   icon: '〰️', tool: 'flatten', color: '#ffffff', label: '整平地形（以按下時的中心高度為準）' },
];
const costText = (cost) => Object.entries(cost).map(([k, v]) => `${ICON[k]}${v}`).join(' ');

class Builder {
  constructor(scene) {
    this.scene = scene;
    this.group = new THREE.Group();
    scene.add(this.group);
    this.items = [];
    this.colliders = [];
    this.active = false;
    this.tool = 0;
    this.rot = 0;
    this.aim = new THREE.Vector3();
    this.mouseSculpt = false;
    this.flatTarget = null;
    this.dirty = null;
    this.flushT = 0;
    this.ray = new THREE.Raycaster();
    this.ghostMat = new THREE.MeshBasicMaterial({ color: '#74e3b8', transparent: true, opacity: 0.5, depthWrite: false });
    this.ghosts = new Map();
    // 筆刷範圍圈
    this.ringPos = new Float32Array(65 * 3);
    const rg = new THREE.BufferGeometry();
    rg.setAttribute('position', new THREE.BufferAttribute(this.ringPos, 3));
    this.ring = new THREE.Line(rg, new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, depthTest: false }));
    this.ring.renderOrder = 10;
    this.ring.frustumCulled = false;
    this.ring.visible = false;
    scene.add(this.ring);
    this.buildSlots();
  }
  get def() { return BUILD_DEFS[this.tool]; }
  isSculptTool() { return !!this.def.tool; }

  buildSlots() {
    const wrap = $('slots');
    this.slotEls = BUILD_DEFS.map((d, i) => {
      const b = document.createElement('button');
      b.className = `slot${d.tool ? ' tool' : ''}`;
      b.title = d.tool ? d.label : `${d.name}：${costText(d.cost)}`;
      b.innerHTML = `<kbd>${i + 1}</kbd><span class="ic">${d.icon}</span><b>${d.name}</b><small>${d.tool ? '免費' : costText(d.cost)}</small>`;
      b.addEventListener('click', () => { this.select(i); b.blur(); });
      wrap.appendChild(b);
      return b;
    });
    this.refreshSlots();
  }
  refreshSlots() {
    this.slotEls.forEach((el, i) => {
      const d = BUILD_DEFS[i];
      el.classList.toggle('sel', i === this.tool);
      el.classList.toggle('poor', !d.tool && !!this.missing(d.cost));
    });
  }
  setActive(on) {
    this.active = on;
    document.body.classList.toggle('building', on);
    $('buildbar').classList.toggle('hide', !on);
    if (!on) {
      this.ghosts.forEach((g) => { g.visible = false; });
      this.ring.visible = false;
      this.mouseSculpt = false;
      setPrompt(null);
    }
  }
  select(i) {
    this.tool = clamp(i, 0, BUILD_DEFS.length - 1);
    this.flatTarget = null;
    this.refreshSlots();
    if (!this.active) this.setActive(true);
  }
  rotate() { this.rot = (this.rot + Math.PI / 4) % (Math.PI * 2); }

  ghostFor(def) {
    if (!this.ghosts.has(def.id)) {
      const g = def.make();
      const drop = [];
      g.traverse((o) => {
        if (o.userData.isOutline || o.userData.isGlow) drop.push(o);
        else if (o.isMesh) { o.material = this.ghostMat; o.castShadow = o.receiveShadow = false; o.renderOrder = 5; }
      });
      drop.forEach((o) => o.removeFromParent());   // 預覽不需要描邊與光暈
      g.visible = false;
      this.scene.add(g);
      this.ghosts.set(def.id, g);
    }
    return this.ghosts.get(def.id);
  }
  missing(cost) {
    const need = Object.entries(cost).filter(([k, v]) => state.inv[k] < v).map(([k, v]) => `${ICON[k]}${v - state.inv[k]}`);
    return need.length ? need.join(' ') : '';
  }
  /** 沿滑鼠射線在高度場上步進，找出瞄準的地面點 */
  updateAim(mouse) {
    this.ray.setFromCamera(mouse, camera);
    const o = this.ray.ray.origin, d = this.ray.ray.direction;
    let lo = 0, hi = -1;
    for (let t = 0.5; t < 90; t += 0.5) {
      if (o.y + d.y * t < terrain.heightAt(o.x + d.x * t, o.z + d.z * t)) { hi = t; break; }
      lo = t;
    }
    if (hi < 0) {
      this.aim.set(player.pos.x - Math.sin(cam.yaw) * 3, 0, player.pos.z - Math.cos(cam.yaw) * 3);
    } else {
      for (let k = 0; k < 8; k++) {
        const m = (lo + hi) / 2;
        if (o.y + d.y * m < terrain.heightAt(o.x + d.x * m, o.z + d.z * m)) hi = m; else lo = m;
      }
      this.aim.set(o.x + d.x * hi, 0, o.z + d.z * hi);
    }
    this.aim.y = terrain.heightAt(this.aim.x, this.aim.z);
  }
  evaluate(def) {
    const a = this.aim, P = player.pos;
    if (Math.hypot(a.x - P.x, a.z - P.z) > (def.tool ? 18 : 14)) return { ok: false, reason: '太遠了，走近一點再動手' };
    if (Math.hypot(a.x, a.z) > WORLD.PLAY) return { ok: false, reason: '這裡已經是世界的邊緣' };
    if (def.tool) return { ok: true };
    if (a.y < WORLD.WATER_Y + 0.15) return { ok: false, reason: '不能蓋在水裡' };
    if (terrain.slopeAt(a.x, a.z) > (def.id === 'hut' ? 0.22 : 0.38)) return { ok: false, reason: '地面太陡了，先用「整平」' };
    for (const it of this.items) {
      if (Math.hypot(it.x - a.x, it.z - a.z) < (it.def.radius + def.radius) * 0.75) return { ok: false, reason: `離${it.def.name}太近了` };
    }
    for (const c of forest.colliders) {
      if (!c.node.sunk && Math.hypot(c.x - a.x, c.z - a.z) < c.r + def.radius * 0.7) return { ok: false, reason: '被樹木或岩石擋住了' };
    }
    const miss = this.missing(def.cost);
    if (miss) return { ok: false, reason: `材料不足：還差 ${miss}` };
    return { ok: true };
  }
  spawn(id, x, z, rot) {
    const def = BUILD_DEFS.find((d) => d.id === id);
    if (!def || def.tool) return null;
    const g = def.make();
    g.position.set(x, terrain.heightAt(x, z), z);
    g.rotation.y = rot;
    this.group.add(g);
    const item = { def, x, z, rot, group: g, colliders: [] };
    const c = Math.cos(rot), s = Math.sin(rot);
    for (const [lx, lz, r] of def.colliders) {
      const col = { x: x + lx * c + lz * s, z: z - lx * s + lz * c, r, top: def.top, base: g.position.y, item };
      item.colliders.push(col);
      this.colliders.push(col);
    }
    this.items.push(item);
    return item;
  }
  place() {
    const def = this.def;
    if (def.tool) return;
    const ev = this.evaluate(def);
    if (!ev.ok) { toast(ev.reason, 'warn'); return; }
    for (const [k, v] of Object.entries(def.cost)) state.inv[k] -= v;
    const it = this.spawn(def.id, this.aim.x, this.aim.z, this.rot);
    burst.emit(it.group.position.clone().add(new THREE.Vector3(0, 0.3, 0)), '#e8d6a8', 18, 3);
    floatText(`${def.icon} 蓋好了${def.name}！`, it.group.position.clone().add(new THREE.Vector3(0, 2, 0)));
    player.doAction();
    onInventoryChanged();
  }
  removeAt() {
    let best = null, bd = Infinity;
    for (const it of this.items) {
      const d = Math.hypot(it.x - this.aim.x, it.z - this.aim.z);
      if (d < Math.max(it.def.radius, 1.2) + 0.4 && d < bd) { bd = d; best = it; }
    }
    if (!best) { toast('游標附近沒有可以拆除的建築', 'warn'); return; }
    this.group.remove(best.group);
    this.items.splice(this.items.indexOf(best), 1);
    this.colliders = this.colliders.filter((c) => c.item !== best);
    for (const [k, v] of Object.entries(best.def.cost)) state.inv[k] += v;
    burst.emit(best.group.position.clone().add(new THREE.Vector3(0, 0.5, 0)), '#c9b48a', 16, 3);
    toast(`拆掉了${best.def.name}，材料都還給你了`);
    onInventoryChanged();
  }
  clear() {
    this.group.clear();
    this.items = [];
    this.colliders = [];
  }
  serialize() {
    return this.items.map((it) => [it.def.id, +it.x.toFixed(2), +it.z.toFixed(2), +it.rot.toFixed(3)]);
  }
  refreshRegion(b) {
    for (const it of this.items) {
      if (it.x < b.x0 - 3 || it.x > b.x1 + 3 || it.z < b.z0 - 3 || it.z > b.z1 + 3) continue;
      it.group.position.y = terrain.heightAt(it.x, it.z);
      it.colliders.forEach((c) => { c.base = it.group.position.y; });
    }
  }
  markDirty(r) {
    if (!this.dirty) this.dirty = r.slice();
    else {
      this.dirty[0] = Math.min(this.dirty[0], r[0]); this.dirty[1] = Math.min(this.dirty[1], r[1]);
      this.dirty[2] = Math.max(this.dirty[2], r[2]); this.dirty[3] = Math.max(this.dirty[3], r[3]);
    }
  }
  update(dt, t, mouse, useHeld) {
    // 星之燈上的星星慢慢轉
    for (const it of this.items) if (it.def.id === 'starlamp') it.group.children.forEach((c) => { if (c.userData.spin) c.rotation.y = t * 1.2; });

    if (this.active) {
      const def = this.def;
      this.updateAim(mouse);
      const ev = this.evaluate(def);
      this.ghosts.forEach((g, id) => { g.visible = !def.tool && id === def.id; });
      if (def.tool) {
        this.ring.visible = true;
        this.ring.material.color.set(ev.ok ? def.color : '#ff6b6b');
        for (let k = 0; k <= 64; k++) {
          const a = (k / 64) * Math.PI * 2, x = this.aim.x + Math.cos(a) * 4.5, z = this.aim.z + Math.sin(a) * 4.5;
          this.ringPos[k * 3] = x; this.ringPos[k * 3 + 1] = Math.max(terrain.heightAt(x, z), WORLD.WATER_Y) + 0.15; this.ringPos[k * 3 + 2] = z;
        }
        this.ring.geometry.attributes.position.needsUpdate = true;
        const sculpting = (this.mouseSculpt || useHeld) && ev.ok;
        if (sculpting) {
          if (this.flatTarget === null) this.flatTarget = this.aim.y;
          this.markDirty(terrain.sculpt(this.aim.x, this.aim.z, def.tool, dt, this.flatTarget));
        } else this.flatTarget = null;
        setPrompt(ev.ok ? `${def.icon} ${def.label}：按住左鍵或 F` : `✖ ${ev.reason}`, ev.ok ? 'ok' : 'warn');
      } else {
        this.ring.visible = false;
        const g = this.ghostFor(def);
        g.position.copy(this.aim);
        g.rotation.y = this.rot;
        this.ghostMat.color.set(ev.ok ? '#74e3b8' : '#ff6b6b');
        setPrompt(ev.ok ? `${def.icon} ${def.name}（${costText(def.cost)}）：左鍵或 F 放置 · R 旋轉` : `✖ ${ev.reason}`, ev.ok ? 'ok' : 'warn');
      }
    }
    // 捏地形的重度更新節流到每秒約 12 次
    this.flushT -= dt;
    if (this.dirty && this.flushT <= 0) {
      onTerrainChanged(this.dirty);
      this.dirty = null;
      this.flushT = 0.08;
      queueSave();
    }
  }
}

/* ---------- 地形變動 → 同步所有依附在地面上的東西 ---------- */
function onTerrainChanged(r) {
  terrain.updateRegion(r[0], r[1], r[2], r[3]);
  const b = terrain.boundsOf(r);
  water.updateDepth(terrain, b);
  vegetation.refreshRegion(b, terrain);
  forest.refreshRegion(b, terrain, state.time);
  builder.refreshRegion(b);
  stars.refreshRegion(b, terrain);
}

/* ---------- 碰撞：把角色推出樹幹、岩石與建築 ---------- */
function collidePlayer(p) {
  const PR = 0.38;
  const test = (c) => {
    const min = c.r + PR, dx = p.x - c.x, dz = p.z - c.z;
    if (Math.abs(dx) > min || Math.abs(dz) > min || p.y > c.base + c.top) return;
    const d = Math.hypot(dx, dz);
    if (d >= min) return;
    if (d < 1e-4) { p.x += min; return; }
    p.x = c.x + (dx / d) * min;
    p.z = c.z + (dz / d) * min;
  };
  for (const c of forest.colliders) if (!c.node.sunk) test(c);
  for (const c of builder.colliders) test(c);
}

/* ---------- 採集 ---------- */
const GATHER = {
  broad:   { verb: '搖晃樹木', res: 'wood', amount: 2, cool: 20, color: '#6fbf4f', fx: 3.6, wait: '樹枝還在長' },
  conifer: { verb: '搖晃杉樹', res: 'wood', amount: 2, cool: 20, color: '#4f8f55', fx: 3.2, wait: '樹枝還在長' },
  bush:    { verb: '撥開灌木', res: 'wood', amount: 1, cool: 12, color: '#8cc463', fx: 0.9, wait: '灌木還在長' },
  rock:    { verb: '敲敲石頭', res: 'stone', amount: 1, color: '#b3aab0', fx: 0.6, wait: '石頭要休息' },
};
function findGatherTarget() {
  const P = player.pos;
  let best = null, bd = 1.3;
  for (const n of forest.nodes) {
    if (n.sunk) continue;
    const dx = n.x - P.x, dz = n.z - P.z;
    if (Math.abs(dx) > 5 || Math.abs(dz) > 5 || Math.abs(P.y - n.collider.base) > 2.5) continue;
    const d = Math.hypot(dx, dz) - n.collider.r;
    if (d < bd) { bd = d; best = { node: n }; }
  }
  const f = vegetation.nearestFlower(P.x, P.z, 1.3);
  if (f && f.d - 0.3 < bd) best = { flower: f.flower };
  return best;
}
function gatherPrompt(target, t) {
  if (target.flower) return `<kbd>E</kbd> 摘下${vegetation.flowerNames[target.flower.rec.type]} · 🌸 +1`;
  const n = target.node, G = GATHER[n.kind];
  if (n.kind === 'rock') {
    if (n.charges <= 0) return `🪨 ${G.wait}…還要 ${Math.ceil(n.regenAt - t)} 秒`;
    return `<kbd>E</kbd> ${G.verb} · 🪨 +1（還能敲 ${n.charges} 次）`;
  }
  if (t < n.readyAt) return `🍃 ${G.wait}…還要 ${Math.ceil(n.readyAt - t)} 秒`;
  return `<kbd>E</kbd> ${G.verb} · ${ICON[G.res]} +${G.amount}`;
}
function gather(target, t) {
  const above = (y) => new THREE.Vector3(0, y, 0);
  if (target.flower) {
    const f = target.flower;
    vegetation.pick(f, t);
    const pos = new THREE.Vector3(f.x, terrain.heightAt(f.x, f.z) + 0.8, f.z);
    burst.emit(pos, vegetation.flowerColors[f.rec.type], 12, 2.2, 0.8);
    gain('flower', 1, pos);
  } else {
    const n = target.node, G = GATHER[n.kind];
    if (n.kind === 'rock') {
      if (n.charges <= 0) return;
      n.charges--;
      if (n.charges <= 0) n.regenAt = t + 60;
    } else {
      if (t < n.readyAt) return;
      n.readyAt = t + G.cool;
    }
    n.shake = n.kind === 'rock' ? 0.3 : 0.7;
    forest.active.add(n);
    const pos = new THREE.Vector3(n.x, n.collider.base, n.z).add(above(G.fx * n.sc));
    burst.emit(pos, G.color, n.kind === 'rock' ? 10 : 20, n.kind === 'rock' ? 2.5 : 3.2);
    gain(G.res, G.amount, new THREE.Vector3(n.x, n.collider.base + Math.min(G.fx * n.sc, 3) + 0.6, n.z));
  }
  player.doAction();
}
function gain(res, amount, pos) {
  state.inv[res] += amount;
  floatText(`${ICON[res]} ${NAME[res]} +${amount}`, pos);
  const row = document.querySelector(`.inv-row[data-k="${res}"]`);
  if (row) { row.classList.add('bump'); setTimeout(() => row.classList.remove('bump'), 350); }
  onInventoryChanged();
}

/* ---------- 存檔（每個種子各自一份，存在 localStorage） ---------- */
const SAVE_VERSION = 1;
const saveKey = (seed) => `painterly-meadow:v${SAVE_VERSION}:${seed}`;
function loadSave(seed) {
  try { return JSON.parse(localStorage.getItem(saveKey(seed)) || 'null'); } catch { return null; }
}
let saveTimer = 0;
function saveNow() {
  if (!state.ready) return;
  const data = { inv: state.inv, stars: stars.collectedList(), builds: builder.serialize(), sculpt: terrain.deltaList() };
  try { localStorage.setItem(saveKey(state.seed), JSON.stringify(data)); } catch { /* 隱私模式或空間不足時略過 */ }
}
function queueSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 700); }
function onInventoryChanged() {
  refreshInventoryUI();
  queueSave();
}
function refreshInventoryUI() {
  $('invWood').textContent = state.inv.wood;
  $('invStone').textContent = state.inv.stone;
  $('invFlower').textContent = state.inv.flower;
  $('invStar').textContent = state.inv.star;
  $('starProg').textContent = `${stars.found}/${stars.total}`;
  builder.refreshSlots();
}

/* =====================================================================
   14. 環境：時間 / 日落色溫
   ===================================================================== */
const PALETTE = [
  { t: 5.5,  top: '#2f3a78', hor: '#f2a48f', bottom: '#6a5a9a', sun: '#ff9566', sunI: 0.55, sky: '#a99be0', ground: '#4a3b7e', hemiI: 1.15 },
  { t: 7.0,  top: '#6f97d8', hor: '#ffd3b0', bottom: '#9c8cc4', sun: '#ffc08a', sunI: 1.35, sky: '#b9b6f0', ground: '#6650a0', hemiI: 1.4 },
  { t: 10.0, top: '#4c97e0', hor: '#cfeaf7', bottom: '#a9b8e0', sun: '#fff1d6', sunI: 1.75, sky: '#b5c6f4', ground: '#7460b0', hemiI: 1.55 },
  { t: 14.0, top: '#4593de', hor: '#d6eef8', bottom: '#a9b8e0', sun: '#fff6e4', sunI: 1.8,  sky: '#b8c9f6', ground: '#7562b2', hemiI: 1.55 },
  { t: 16.8, top: '#6189d2', hor: '#ffe3ad', bottom: '#b0a3cf', sun: '#ffd08c', sunI: 1.65, sky: '#c3b9ee', ground: '#7058a8', hemiI: 1.45 },
  { t: 18.4, top: '#5a5aa8', hor: '#ffa36e', bottom: '#9a7aa8', sun: '#ff8a4c', sunI: 1.3,  sky: '#c4a2e0', ground: '#5b4396', hemiI: 1.45 },
  { t: 20.0, top: '#232a5e', hor: '#a0608a', bottom: '#463a70', sun: '#ff7a62', sunI: 0.45, sky: '#9184d0', ground: '#3b3478', hemiI: 1.3 },
].map((k) => {
  const o = { ...k };
  for (const key of ['top', 'hor', 'bottom', 'sun', 'sky', 'ground']) o[key] = new THREE.Color(k[key]);
  return o;
});
const WARM = { sun: new THREE.Color('#ff8f4f'), hor: new THREE.Color('#ffb07a'), sky: new THREE.Color('#ffc8a8') };
const COOL = { sun: new THREE.Color('#a9c6ff'), hor: new THREE.Color('#bcd4ff'), sky: new THREE.Color('#9fb4ff') };

function samplePalette(hour) {
  let i = 0;
  while (i < PALETTE.length - 2 && hour > PALETTE[i + 1].t) i++;
  const A = PALETTE[i], B = PALETTE[i + 1];
  const f = smoothstep(0, 1, clamp((hour - A.t) / (B.t - A.t), 0, 1));
  const out = {};
  for (const key of ['top', 'hor', 'bottom', 'sun', 'sky', 'ground']) out[key] = A[key].clone().lerp(B[key], f);
  out.sunI = lerp(A.sunI, B.sunI, f);
  out.hemiI = lerp(A.hemiI, B.hemiI, f);
  return out;
}

function applyEnvironment() {
  const P = samplePalette(state.hour);
  const w = state.warmth, aw = Math.abs(w), T = w >= 0 ? WARM : COOL;
  const sunCol = P.sun.lerp(T.sun, aw * 0.45);
  const horizon = P.hor.lerp(T.hor, aw * 0.35);
  const skyCol = P.sky.lerp(T.sky, aw * 0.3);

  // 太陽軌跡
  const dayT = (state.hour - 5.5) / 14.5;
  const el = 0.06 + Math.sin(dayT * Math.PI) * 0.98;
  const az = dayT * Math.PI;
  sunDir.set(Math.cos(az) * Math.cos(el), Math.sin(el), -0.45 * Math.cos(el)).normalize();

  sun.color.copy(sunCol);
  sun.intensity = P.sunI;
  hemi.color.copy(skyCol);
  hemi.groundColor.copy(P.ground);
  hemi.intensity = P.hemiI;

  const su = sky.material.uniforms;
  su.uTop.value.copy(P.top).lerp(T.sky, aw * 0.12);
  su.uHorizon.value.copy(horizon);
  su.uBottom.value.copy(P.bottom);
  su.uSunColor.value.copy(sunCol);
  scene.fog.color.copy(horizon);
  renderer.setClearColor(horizon);

  // 水色 / 雲 / 絨毛跟著光線變化
  const light = new THREE.Color(1, 1, 1).lerp(sunCol, 0.35).multiplyScalar(clamp(0.38 + (P.sunI / 1.8) * 0.65, 0, 1.05));
  const wu = water.material.uniforms;
  wu.uShallow.value.set('#8fe0cf').multiply(light);
  wu.uDeep.value.set('#2d7fb0').multiply(light).lerp(P.top, 0.18);
  wu.uFoam.value.copy(light).lerp(new THREE.Color(1, 1, 1), 0.3);
  wu.uSky.value.copy(horizon);
  wu.uSunColor.value.copy(sunCol);
  clouds.mat.emissive.copy(horizon).lerp(skyCol, 0.4);
  clouds.mat.emissiveIntensity = 0.32;
  particles.fluff.material.color.copy(light).lerp(horizon, 0.15);
  // 天色越暗，燈籠、窗戶與星之碎片越亮
  const night = 1 - smoothstep(0.5, 1.5, P.sunI);
  glowMat.emissiveIntensity = 0.5 + night * 1.8;
  glowSpriteMat.opacity = 0.2 + night * 0.75;
  stars.mat.emissiveIntensity = 0.6 + night * 1.2;
  stars.glowMat.opacity = 0.6 + night * 0.4;

  const hh = Math.floor(state.hour), mm = Math.round((state.hour - hh) * 60) % 60;
  $('timeVal').textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}

/* =====================================================================
   15. 鏡頭 / 輸入
   ===================================================================== */
const cam = { yaw: 0.7, pitch: 0.42, dist: 11, target: new THREE.Vector3() };
function updateCamera(dt) {
  const want = player.pos.clone();
  want.y += 1.1;
  cam.target.lerp(want, damp(9, dt));
  const d = cam.dist + (player.gliding ? 2.5 : 0);
  cam.curDist = cam.curDist === undefined ? d : lerp(cam.curDist, d, damp(3, dt));
  const cp = Math.cos(cam.pitch);
  camera.position.set(
    cam.target.x + Math.sin(cam.yaw) * cp * cam.curDist,
    cam.target.y + Math.sin(cam.pitch) * cam.curDist,
    cam.target.z + Math.cos(cam.yaw) * cp * cam.curDist
  );
  const floor = Math.max(terrain.heightAt(camera.position.x, camera.position.z), WORLD.WATER_Y) + 1.7;   // 鏡頭保持在草叢之上
  if (camera.position.y < floor) camera.position.y = floor;
  camera.lookAt(cam.target);
  sky.position.copy(camera.position);
}

const input = { fwd: false, back: false, left: false, right: false, run: false, jumpHeld: false };
const KEYMAP = {
  KeyW: 'fwd', ArrowUp: 'fwd', KeyS: 'back', ArrowDown: 'back',
  KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
  ShiftLeft: 'run', ShiftRight: 'run',
};
const isTyping = (e) => e.target instanceof HTMLInputElement && e.target.type === 'text';
let gatherTarget = null;
addEventListener('keydown', (e) => {
  if (isTyping(e)) return;
  if (KEYMAP[e.code]) { input[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) player.requestJump();
    input.jumpHeld = true;
  }
  if (e.repeat || !state.ready) return;
  const digit = /^(Digit|Numpad)([1-9])$/.exec(e.code);
  if (digit) { builder.select(+digit[2] - 1); return; }
  switch (e.code) {
    case 'KeyE': if (!builder.active && gatherTarget) gather(gatherTarget, state.time); break;
    case 'KeyB': builder.setActive(!builder.active); break;
    case 'Escape': builder.setActive(false); break;
    case 'KeyR': if (builder.active) builder.rotate(); break;
    case 'KeyX': if (builder.active) builder.removeAt(); break;
    case 'KeyF':
      input.use = true;
      if (builder.active && !builder.isSculptTool()) builder.place();
      break;
  }
});
addEventListener('keyup', (e) => {
  if (KEYMAP[e.code]) input[KEYMAP[e.code]] = false;
  if (e.code === 'KeyF') input.use = false;
  if (e.code === 'Space') { input.jumpHeld = false; if (!isTyping(e)) e.preventDefault(); }
});
addEventListener('blur', () => { for (const k in input) input[k] = false; builder.mouseSculpt = false; });

const canvas = renderer.domElement;
const mouse = new THREE.Vector2(0, -0.2);   // 建造模式的瞄準點（NDC）
let drag = null;
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointerdown', (e) => {
  // 捏地形時左鍵用來塗抹，其餘情況拖曳都是旋轉鏡頭
  const sculpt = builder.active && builder.isSculptTool() && e.button === 0;
  drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, button: e.button, rotate: !sculpt };
  if (sculpt) builder.mouseSculpt = true;
  canvas.setPointerCapture(e.pointerId);
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
});
canvas.addEventListener('pointermove', (e) => {
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  if (!drag || !drag.rotate) return;
  cam.yaw -= (e.clientX - drag.x) * 0.006;
  cam.pitch = clamp(cam.pitch + (e.clientY - drag.y) * 0.004, 0.05, 1.25);
  drag.x = e.clientX; drag.y = e.clientY;
});
const endDrag = (e) => {
  // 建造模式下「點一下」（沒有拖曳）＝放置
  if (drag && e.type === 'pointerup' && builder.active && drag.button === 0 && !builder.isSculptTool() &&
      Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) builder.place();
  drag = null;
  builder.mouseSculpt = false;
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  cam.dist = clamp(cam.dist * (1 + Math.sign(e.deltaY) * 0.08), 4.5, 26);
}, { passive: false });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* =====================================================================
   16. 世界生成
   ===================================================================== */
const terrain = new Terrain(scene);
const water = new Water(scene);
const vegetation = new Vegetation(scene);
const forest = new Forest(scene);
const clouds = new Clouds(scene);
const particles = new Particles(scene);
const player = new Player(scene);
const burst = new Burst(scene);
const stars = new StarFragments(scene);
const builder = new Builder(scene);
const loading = $('loading');

function generateWorld(seed) {
  if (state.ready) { clearTimeout(saveTimer); saveNow(); }   // 離開前先存目前的世界
  state.ready = false;
  builder.setActive(false);
  state.seed = seed;
  $('seed').value = seed;
  // 把種子寫回網址，方便分享同一座世界
  const url = new URL(location.href);
  url.searchParams.set('seed', seed);
  try { history.replaceState(null, '', url); } catch { /* file:// 等環境可能不允許 */ }
  loading.classList.remove('hidden');
  // 先讓「繪製中」畫面出現，再進行同步的重度生成
  requestAnimationFrame(() => setTimeout(() => {
    const t0 = performance.now();
    const noise = new SimplexNoise(mulberry32(seed));
    terrain.generate(noise, mulberry32(seed ^ 0x9e3779b9));
    water.updateDepth(terrain);
    const spawn = terrain.findSpawn();
    vegetation.generate(terrain, noise, mulberry32(seed ^ 0x85ebca6b));
    forest.generate(terrain, noise, mulberry32(seed ^ 0xc2b2ae35), spawn);
    const cr = mulberry32(seed ^ 0x27d4eb2f);
    clouds.generate(cr);
    state.windAngle = cr() * Math.PI * 2;

    // 讀取這個種子的存檔：先在原始地形上擺好一切，再套用捏地形差異
    const save = loadSave(seed) || {};
    stars.generate(terrain, mulberry32(seed ^ 0x165667b1), spawn, forest.colliders, save.stars || []);
    state.inv = { wood: 0, stone: 0, flower: 0, star: 0, ...(save.inv || {}) };
    builder.clear();
    if (save.sculpt && save.sculpt.length) {
      terrain.applyDelta(save.sculpt);
      onTerrainChanged([0, 0, terrain.N, terrain.N]);
    }
    for (const [id, x, z, rot] of save.builds || []) builder.spawn(id, x, z, rot);
    spawn.y = Math.max(terrain.heightAt(spawn.x, spawn.z), WORLD.WATER_Y - 0.55);
    player.spawn(spawn);
    cam.target.copy(spawn);
    particles.reset(spawn, terrain);
    console.info(`[world] seed ${seed} generated in ${(performance.now() - t0).toFixed(0)} ms`);
    loading.classList.add('hidden');
    state.ready = true;
    refreshInventoryUI();
    const progress = save.builds?.length || save.sculpt?.length || save.stars?.length || Object.values(save.inv || {}).some((v) => v > 0);
    if (progress) toast('🗂 已載入這個世界的存檔');
  }, 30));
}

/* =====================================================================
   17. UI 綁定
   ===================================================================== */
function syncRange(el) {
  const p = ((el.value - el.min) / (el.max - el.min)) * 100;
  el.style.setProperty('--p', `${p}%`);
}
$('wind').addEventListener('input', (e) => {
  state.wind = +e.target.value;
  windUniforms.uWind.value = state.wind;
  $('windVal').textContent = state.wind.toFixed(2);
  syncRange(e.target);
});
$('time').addEventListener('input', (e) => { state.hour = +e.target.value; applyEnvironment(); });
$('warmth').addEventListener('input', (e) => {
  state.warmth = +e.target.value;
  const w = state.warmth;
  $('warmVal').textContent = Math.abs(w) < 0.01 ? '±0' : `${w > 0 ? '暖 +' : '冷 −'}${Math.abs(w).toFixed(2)}`;
  applyEnvironment();
});
$('reseed').addEventListener('click', () => generateWorld(Math.floor(Math.random() * 900000) + 1000));
$('seed').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { generateWorld(hashSeed(e.target.value)); e.target.blur(); }
});
$('wipe').addEventListener('click', () => {
  if (!confirm('要清除這個世界的存檔嗎？背包、建築、地形修改與星之碎片紀錄都會重置。')) return;
  clearTimeout(saveTimer);
  state.ready = false;   // 避免重建前又被存回去
  try { localStorage.removeItem(saveKey(state.seed)); } catch { /* 略過 */ }
  generateWorld(state.seed);
  toast('🧹 已清除存檔，世界回到最初的樣子');
});
$('outline').addEventListener('click', (e) => {
  state.outlines = !state.outlines;
  const btn = e.currentTarget;
  btn.classList.toggle('on', state.outlines);
  btn.setAttribute('aria-checked', String(state.outlines));
  scene.traverse((o) => { if (o.userData.isOutline) o.visible = state.outlines; });
});
$('collapse').addEventListener('click', (e) => {
  const c = $('panel').classList.toggle('collapsed');
  e.currentTarget.textContent = c ? '+' : '–';
});
// 點擊後釋放焦點，避免空白鍵觸發按鈕 / 方向鍵改滑塊
document.querySelectorAll('#panel button').forEach((b) => b.addEventListener('click', () => b.blur()));
document.querySelectorAll('#panel input[type=range]').forEach((r) => r.addEventListener('change', () => r.blur()));
syncRange($('wind'));

const glideUI = $('glide'), glideBar = glideUI.querySelector('i');
addEventListener('beforeunload', () => { clearTimeout(saveTimer); saveNow(); });

/* =====================================================================
   18. 主迴圈
   ===================================================================== */
applyEnvironment();
const urlSeed = new URLSearchParams(location.search).get('seed');
generateWorld(urlSeed ? hashSeed(urlSeed) : state.seed);

const clock = new THREE.Clock();
const shadowTarget = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  state.time += dt;
  const t = state.time;

  // 風向緩慢迴旋
  const ang = state.windAngle + Math.sin(t * 0.05) * 0.35;
  const wd = windUniforms.uWindDir.value.set(Math.cos(ang), Math.sin(ang));
  windUniforms.uTime.value = t;

  player.update(dt, input, cam.yaw, terrain, wd, state.wind, collidePlayer);
  windUniforms.uPlayer.value.copy(player.pos);
  updateCamera(dt);

  // 採集 / 星之碎片 / 建造
  if (state.ready) {
    gatherTarget = builder.active ? null : findGatherTarget();
    if (!builder.active) setPrompt(gatherTarget ? gatherPrompt(gatherTarget, t) : null);
    stars.update(dt, t, player.pos, (s) => {
      burst.emit(s.group.position, '#ffd84a', 26, 4, 1.1);
      gain('star', 1, s.group.position.clone().add(new THREE.Vector3(0, 0.8, 0)));
      if (stars.found === stars.total) toast('🌟 這個世界的星之碎片全部找齊了！');
      else toast(`✨ 找到星之碎片（${stars.found}/${stars.total}）`);
    });
    builder.update(dt, t, mouse, input.use);
  }
  forest.update(dt, t);
  vegetation.update(t);
  burst.update(dt);
  updateFloaters(dt);

  clouds.update(dt, wd, state.wind);
  particles.update(dt, t, player.pos, terrain, wd, state.wind);
  water.update(t);

  // 陰影相機跟隨角色（以整數格對齊減少閃爍）
  shadowTarget.set(Math.round(player.pos.x), Math.round(player.pos.y), Math.round(player.pos.z));
  sun.target.position.copy(shadowTarget);
  sun.position.copy(shadowTarget).addScaledVector(sunDir, 240);

  glideUI.classList.toggle('hide', player.stamina > 0.995 && !player.gliding);
  glideBar.style.width = `${(player.stamina * 100).toFixed(1)}%`;

  renderer.render(scene, camera);
});
</script>
<script>
  // 不支援 ES Module / import map 的瀏覽器提示
  window.addEventListener('error', (e) => {
    if (String(e.message || '').match(/import|module|WebGL/i)) {
      const el = document.getElementById('error');
      el.style.display = 'grid';
      el.textContent = '無法載入 3D 場景：請使用支援 WebGL 與 ES Module 的現代瀏覽器，並確認可連線至 CDN。';
    }
  });
</script>
